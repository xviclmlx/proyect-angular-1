<div class="auth-container">
  <p-card header="Iniciar Sesión" class="auth-card">
    <div class="p-fluid">

      <p-message *ngIf="errorMessage" severity="error" text="{{ errorMessage }}"></p-message>

      <div class="p-field">
        <label for="email">Correo electrónico</label>
        <input id="email" pInputText [(ngModel)]="email" type="email" placeholder="ejemplo@correo.com" />
      </div>

      <div class="p-field">
        <label for="password">Contraseña</label>
        <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true" placeholder="••••••••"></p-password>
      </div>

      <button pButton label="Ingresar" icon="pi pi-sign-in" class="auth-button" (click)="login()"></button>
    </div>
  </p-card>
</div>
