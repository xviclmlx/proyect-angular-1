<!-- Cambia la clase del contenedor entre "light" y "dark" -->
<div class="auth-container light">
  <p-card header="Registro de Usuario" class="auth-card light">
    <form (ngSubmit)="validar()" class="auth-form">

      <!-- Mensajes de error -->
      <p-message
        *ngFor="let error of errores"
        severity="error"
        [text]="error"
        class="auth-error">
      </p-message>

      <!-- Campos -->
      <div class="p-field">
        <label for="usuario">Usuario</label>
        <input id="usuario" pInputText [(ngModel)]="usuario" name="usuario" placeholder="Nombre de usuario" />
      </div>

      <div class="p-field">
        <label for="email">Correo electrónico</label>
        <input id="email" pInputText [(ngModel)]="email" name="email" type="email" placeholder="ejemplo@correo.com" />
      </div>

      <div class="p-field">
        <label for="nombreCompleto">Nombre completo</label>
        <input id="nombreCompleto" pInputText [(ngModel)]="nombreCompleto" name="nombreCompleto" placeholder="Tu nombre completo" />
      </div>

      <div class="p-field">
        <label for="direccion">Dirección</label>
        <input id="direccion" pInputText [(ngModel)]="direccion" name="direccion" placeholder="Dirección" />
      </div>

      <div class="p-field">
        <label for="edad">Edad</label>
        <input id="edad" pInputText [(ngModel)]="edad" name="edad" type="number" placeholder="Edad" />
      </div>

      <div class="p-field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" pInputText [(ngModel)]="telefono" name="telefono" maxlength="10" placeholder="Teléfono (10 dígitos)" />
      </div>

      <div class="p-field">
        <label for="password">Contraseña</label>
        <p-password id="password" [(ngModel)]="password" name="password" [feedback]="true" [toggleMask]="true" placeholder="••••••••"></p-password>
      </div>

      <div class="p-field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <p-password id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" [feedback]="false" [toggleMask]="true" placeholder="••••••••"></p-password>
      </div>

      <!-- Botón -->
      <button pButton type="submit" label="Registrar" icon="pi pi-user-plus" class="auth-button"></button>
    </form>
  </p-card>
</div>
